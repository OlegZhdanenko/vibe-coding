name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist; the app degrades gracefully
          # when they are absent, and CI never talks to a real project.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: inboxly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name inboxly \
            -e EMAIL_PROVIDER=mock \
            -e ALLOW_ANONYMOUS_GENERATION=true \
            -p 8080:8080 inboxly:ci

          # Wait for the server to accept connections.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done

          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'

          # The generation endpoint must stream a finished draft.
          curl -sf -X POST http://localhost:8080/api/generate \
            -H 'Content-Type: application/json' \
            -d '{"topic":"Ask my manager for two days off next week","tone":"direct","length":"short","language":"English"}' \
            | tail -1 | grep -q '"type":"done"'

          docker rm -f inboxly
